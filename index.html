<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Trắc nghiệm 50 Từ Vựng: Chính trị, Quân sự & Lịch sử</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f5f0f0; 
            color: #333; 
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 850px; margin: 0 auto; }
        h1 { text-align: center; color: #4a1515; font-size: 1.8em; margin-bottom: 20px; line-height: 1.4;}
        
        /* Bảng điểm ghim trên cùng (Theme Burgundy) */
        .score-banner {
            position: sticky;
            top: 10px;
            background: #800000;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            z-index: 100;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Thẻ chứa từng câu hỏi */
        .question-card { 
            background: #fff; 
            border-radius: 12px; 
            padding: 25px; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.08); 
            border-top: 5px solid #c0392b;
        }
        .q-header { font-size: 0.9em; color: #000000; font-weight: bold; margin-bottom: 10px; text-transform: uppercase;}
        .q-word { font-size: 2.5em; font-weight: bold; color: #2c3e50; margin-bottom: 20px; text-align: center; }
        
        /* Lưới đáp án */
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        
        .opt-btn { 
            padding: 15px; font-size: 1.05em; border: 2px solid #e0e6ed; 
            border-radius: 8px; background: #fff; cursor: pointer; 
            transition: 0.2s; text-align: center; font-weight: 500; color: #34495e;
        }
        .opt-btn:hover:not(:disabled) { border-color: #c0392b; background: #fdf2f2; }
        .opt-btn:disabled { cursor: default; }
        
        /* Màu sắc khi Chọn Đúng / Sai */
        .opt-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .opt-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        
        /* Hộp giải thích CHỮA CHI TIẾT */
        .explanation { 
            margin-top: 20px; padding: 20px; border-radius: 8px; 
            background: #fdfefe; border-left: 5px solid #e74c3c; line-height: 1.6;
            animation: fadeIn 0.4s ease-in-out;
            font-size: 0.95em;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }
        .explanation strong { color: #c0392b; font-size: 1.1em; display: block; margin-bottom: 8px;}
        .explanation .meaning { margin-bottom: 15px; color: #34495e; }
        
        /* Khu vực Ví dụ */
        .example-box {
            background: #f4f6f7; padding: 12px; border-radius: 6px; 
            margin-bottom: 15px; color: #2c3e50; font-style: italic;
            border-left: 3px solid #3498db;
        }
        .example-box .kr-ex { font-weight: bold; font-size: 1.05em; color: #2980b9;}
        .example-box .vn-ex { font-size: 0.95em; color: #7f8c8d; margin-top: 5px;}

        /* Label Hán Việt tách chữ */
        .han-viet-box {
            display: block; background: #fdf2e9; color: #b9770e; 
            padding: 12px; border-radius: 5px; font-size: 0.95em; 
            border: 1px solid #f5cba7;
        }
        .han-viet-box span { font-weight: bold; color: #d35400; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

// Trộn mảng 50 từ
vocabList.sort(() => 0.5 - Math.random());

// Tạo cấu trúc câu hỏi
const quizData = vocabList.map((item, index) => {
    let pool = vocabList.filter((_, i) => i !== index);
    pool.sort(() => 0.5 - Math.random());
    let distractors = [pool[0].vn, pool[1].vn, pool[2].vn];
    
    let options = [...distractors, item.vn];
    options.sort(() => 0.5 - Math.random());
    
    return {
        kr: item.kr,
        options: options,
        correctIndex: options.indexOf(item.vn),
        answerText: item.vn,
        detail: item.detail,
        ex_kr: item.ex_kr,
        ex_vn: item.ex_vn,
        han: item.han
    };
});

let score = 0;
let answeredCount = 0;
const container = document.getElementById('quiz-container');

function renderQuiz() {
    let html = '';
    quizData.forEach((q, qIndex) => {
        html += `
        <div class="question-card" id="q-card-${qIndex}">
            <div class="q-header">Câu ${qIndex + 1} / 50</div>
            <div class="q-word">${q.kr}</div>
            <div class="options" id="opts-${qIndex}">
                ${q.options.map((opt, oIndex) => `
                    <button class="opt-btn" onclick="checkAns(${qIndex}, ${oIndex}, this)">${opt}</button>
                `).join('')}
            </div>
            
            <div class="explanation" id="exp-${qIndex}" style="display:none;">
                <strong>✅ Đáp án đúng: ${q.answerText}</strong>
                <div class="meaning"><em>Giải nghĩa:</em> ${q.detail}</div>
                
                <div class="example-box">
                    📖 <strong>Ví dụ:</strong><br>
                    <div class="kr-ex">${q.ex_kr}</div>
                    <div class="vn-ex">➔ ${q.ex_vn}</div>
                </div>

                <div class="han-viet-box">🔍 <strong>Phân tích:</strong> ${q.han}</div>
            </div>
        </div>
        `;
    });
    container.innerHTML = html;
}

function checkAns(qIndex, selectedIndex, btnElement) {
    const q = quizData[qIndex];
    const optionsDiv = document.getElementById(`opts-${qIndex}`);
    const buttons = optionsDiv.querySelectorAll('.opt-btn');
    
    buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correctIndex) {
            btn.classList.add('correct');
        } else if (idx === selectedIndex) {
            btn.classList.add('wrong');
        }
    });
    
    answeredCount++;
    if (selectedIndex === q.correctIndex) {
        score++;
    }
    
    document.getElementById('score-text').innerText = `Điểm: ${score} / ${answeredCount} (Đã làm: ${answeredCount}/50)`;
    document.getElementById(`exp-${qIndex}`).style.display = 'block';
}

window.onload = renderQuiz;
</script>
